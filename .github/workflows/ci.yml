name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: careerpathdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-not-secret
      DEBUG: "False"
      ALLOWED_HOSTS: testserver
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py check --deploy --fail-level ERROR
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-not-secret
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build --detach --wait
      # --wait doesn't cover the web server (migrations run first), so retry until it answers.
      - run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors --output /dev/null http://localhost:8000/
      - run: docker compose exec -T web pytest
      - if: failure()
        run: docker compose logs
